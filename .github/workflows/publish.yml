name: Generate a build and push to another branch

# Hostinger serves the site from the build branch.

on:
  push:
    branches:
      - main

# One publish at a time, so an older build can never finish last and
# overwrite a newer one. A run waits for the current one instead of
# cancelling it mid-push; GitHub keeps only the newest waiting run.
concurrency:
  group: publish-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and Push
    steps:
      - name: git-checkout
        uses: actions/checkout@v7

      - name: Install, check and build
        uses: ./.github/actions/check

      - name: Push
        # develop@ac113f6 (2025-02-13). Same REPO/BRANCH/FOLDER/GITHUB_TOKEN/MESSAGE
        # contract as the previous @develop pin; the tag does not float.
        uses: s0/git-publish-subdir-action@ac113f6bfe8896e85a373534242c949a7ea74c98
        env:
          REPO: self
          BRANCH: build # The branch name where you want to push the assets
          FOLDER: out # next build writes the static export here
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub will automatically add this - you don't need to bother getting a token
          MESSAGE: "Build: ({sha}) {msg}" # The commit message
