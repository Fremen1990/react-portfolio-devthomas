<!DOCTYPE html>
<html lang="en" translate="no">
  <head>
    <meta charset="utf-8" />
    <link
      rel="shortcut icon"
      href="%PUBLIC_URL%/favicon.webp"
      type="image/webp"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F7F8FA" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("portfolio-theme");
          if (theme === "dark") {
            document.documentElement.classList.add("dark-theme");
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute("content", "#10161b");
          }
          if (theme === "light") {
            document.documentElement.classList.add("light-theme");
          }
        } catch (error) {}
      })();
    </script>
    <title>Tomasz Stanisz, Software Engineer &amp; Tech Lead</title>
    <meta
      name="description"
      content="I design and build web and mobile applications, from user interfaces to backend services. I combine hands-on engineering with architecture, testing and technical leadership."
    />
    <link rel="canonical" href="https://devthomas.pl/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://devthomas.pl/" />
    <meta
      property="og:title"
      content="Tomasz Stanisz, Software Engineer &amp; Tech Lead"
    />
    <meta
      property="og:description"
      content="I design and build web and mobile applications, from user interfaces to backend services. I combine hands-on engineering with architecture, testing and technical leadership."
