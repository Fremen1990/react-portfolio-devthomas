<!DOCTYPE html>
<html lang="en" translate="no">
  <head>
    <meta charset="utf-8" />
    <link
      rel="shortcut icon"
      href="%PUBLIC_URL%/favicon.webp"
      type="image/webp"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F7F8FA" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("portfolio-theme");
          if (theme === "dark") {
            document.documentElement.classList.add("dark-theme");
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute("content", "#10161b");
          }
          if (theme === "light") {
            document.documentElement.classList.add("light-theme");
          }
          if (localStorage.getItem("portfolio-skin") === "terminal") {
            document.documentElement.classList.add("skin-terminal");
            var font = document.createElement("link");
            font.rel = "stylesheet";
            font.href =
              "https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap";
            font.setAttribute("data-skin-font", "terminal");
            document.head.appendChild(font);
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute(
                "content",
                theme === "dark" ? "#07090a" : "#f3f1e7"
              );
          }
        } catch (error) {}
      })();
    </script>
    <title>Tomasz Stanisz, Software Engineer &amp; Tech Lead</title>
    <meta

      content="I design and build web and mobile applications, from user interfaces to backend services. I combine hands-on engineering with architecture, testing and technical leadership."
